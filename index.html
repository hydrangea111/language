<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한자 · 외국어 학습</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%2322443A'/%3E%3Ctext%20x='32'%20y='47'%20font-size='38'%20font-weight='700'%20text-anchor='middle'%20fill='%23F4F3EC'%20font-family='Noto%20Serif%20KR,Noto%20Serif%20JP,serif'%3E語%3C/text%3E%3Ccircle%20cx='51'%20cy='13'%20r='5'%20fill='%23A8362B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/shell.css">
<style>
html[data-theme="dark"]{background:#fff;filter:invert(1) hue-rotate(180deg)}
html[data-theme="dark"] img,html[data-theme="dark"] video,html[data-theme="dark"] picture,html[data-theme="dark"] iframe{filter:invert(1) hue-rotate(180deg)}
@media print{html[data-theme="dark"],html[data-theme="dark"] img{filter:none}}
#theme-toggle{position:fixed;right:10px;bottom:10px;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:transparent;color:inherit;font:14px/26px system-ui,sans-serif;text-align:center;cursor:pointer;opacity:.28;z-index:2147483000;transition:opacity .15s}
#theme-toggle:hover,#theme-toggle:focus-visible{opacity:.85}
@media print{#theme-toggle{display:none}}
</style>
<script>
(function(){var r=document.documentElement,m=matchMedia('(prefers-color-scheme: dark)');
function saved(){try{var s=localStorage.getItem('theme');return s==='light'||s==='dark'?s:null}catch(e){return null}}
function apply(){r.dataset.theme=saved()||(m.matches?'dark':'light')}
apply();m.addEventListener('change',apply);
window.__toggleTheme=function(){var n=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('theme',n)}catch(e){}r.dataset.theme=n}})();
</script>
</head>
<body>
<div id="shell">
  <div id="tabbar"><div class="wrap">
    <button data-tab="hanja" aria-pressed="true">漢 한자</button>
    <button data-tab="ja" aria-pressed="false">일본어</button>
    <button data-tab="zh" aria-pressed="false">중국어</button>
    <button data-tab="es" aria-pressed="false">스페인어</button>
    <button data-tab="yue" aria-pressed="false">광동어</button>
  </div></div>
  <div id="panes">
    <iframe id="f-hanja" class="on" title="한자 학습" src="hanja.html"></iframe>
    <iframe id="f-lang" title="외국어 학습" src="lang.html"></iframe>
    <iframe id="f-yue" title="광동어 학습" data-src="yue.html"></iframe>
  </div>
</div>
<script src="js/shell.js"></script>
<button id="theme-toggle" type="button" aria-label="다크 모드 전환" title="다크 모드 전환" onclick="__toggleTheme()">◐</button>
</body>
</html>
